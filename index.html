<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#102a43">
  <title>Welcome to OST External Exam</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at 15% 15%, rgba(52, 150, 195, 0.3), transparent 38%),
        linear-gradient(135deg, #102a43, #163f5c 55%, #176b78);
    }

    main {
      width: min(100%, 720px);
      padding: clamp(36px, 8vw, 72px) 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(10px);
    }

    .badge {
      display: inline-block;
      margin-bottom: 24px;
      padding: 8px 14px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      color: #d7f4f3;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 8vw, 4.5rem);
      line-height: 1.08;
      letter-spacing: -0.045em;
    }

    h1 span {
      display: block;
      margin-top: 10px;
      color: #8de0d2;
    }

    p {
      max-width: 470px;
      margin: 22px auto 0;
      color: #d7e6ee;
      font-size: clamp(1rem, 2.5vw, 1.15rem);
      line-height: 1.7;
    }

    .accent {
      width: 54px;
      height: 4px;
      margin: 30px auto 0;
      border-radius: 4px;
      background: #8de0d2;
    }
  </style>
</head>
<body>
  <main>
    <div class="badge">OST External Exam</div>
    <h1>Welcome to <span>OST External Exam</span></h1>
    <p>Your exam journey starts here. We wish you the very best of luck!</p>
    <div class="accent" aria-hidden="true"></div>
  </main>
</body>
</html>
